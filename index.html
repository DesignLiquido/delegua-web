<head>

  <meta charset="UTF-8" />

  <title>Linguagem Delégua por Design Líquido - Editor Web</title>
  <link data-name="vs/editor/editor.main" rel="stylesheet" href="vs/editor/editor.main.css" />
  <link rel="icon" href="./icones/favicon-32.png" sizes="32x32">
  <link rel="icon" href="./icones/favicon-128.png" sizes="128x128">
  <link rel="icon" href="./icones/favicon-180.png" sizes="180x180">
  <link rel="icon" href="./icones/favicon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./estilos.css" />
  <link rel="stylesheet" href="./codigos.css" />
  <link href="https://fonts.googleapis.com/css?family=Roboto+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RD4Q6L45K6"></script>
  <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RD4Q6L45K6');

</head>

<body>
  <div id="menuOpcoes" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="fecharMenu()">&times;</a>
    <a href="index.html">Editor</a>
    <a href="exemplos.html">Exemplos</a>
    <a href="configuracoes.html">Configurações</a>
  </div>

  <nav>
    <div class="navbar-esquerda">
      <div onclick="abrirMenu()">
        <div class="icone-burger"></div>
        <div class="icone-burger"></div>
        <div class="icone-burger"></div>
      </div>
    </div>
    <div class="navbar-central">
      <p id="titulo-arquivo">index.delegua</p>
    </div>
    <select onchange="definirTema(this.value)" id="temaEditor">
      <option value="vs">Padrão</option>
      <option value="vs-dark" selected>Visual Studio Escuro</option>
      <option value="hc-black">Escuro</option>
      <option value="hc-light">Claro</option>
    </select>
    <div class="navbar-direita">
        <select id="linguagem">
            <option selected>JavaScript</option>
            <option>Python</option>
        </select>
        <div>
            <button id="botaoTraduzir" title="Traduzir">
							<i class="fa fa-language" style="font-size:20px;"></i>
            </button>

            <button id="botaoCompartilhar" title="Compartilhar">
							<i class="fa fa-share-alt" style="font-size:20px;"></i>
            </button>

            <button id="botaoExecutar" title="Executar">
							<i class="fa fa-play" style="font-size:20px;"></i>
            </button>
          </div>
        <p id="statusFormatacao" class="status-formatacao" aria-live="polite"></p>
    </div>
  </nav>

  <div id="editor" style="z-index: 0 !important;"></div>
  <div id="painelDireito">
    <section id="resultadosTestes" aria-live="polite" hidden></section>
    <div id="resultadoEditor" aria-live="polite"></div>
  </div>

  <script>var exports = {};</script>
  <script src="./snippets/delegua-code-snippets.js"></script>

  <script src="./primitivas.js"></script>
  <script src="./delegua.js"></script>

  <script src="vs/loader.js"></script>
  <script src="vs/editor/editor.main.nls.js"></script>
  <script src="vs/editor/editor.main.js"></script>

  <script src="./editor.js"></script>
  <script src="./menu.js"></script>
  <script src="./exemplos.js"></script>

  <!-- Modal de entrada para leia() -->
  <div id="modalLeia" class="modal-leia-overlay" role="dialog" aria-modal="true"
       aria-labelledby="modalLeiaLabel" style="display:none;">
    <div class="modal-leia-caixa">
      <label id="modalLeiaLabel" class="modal-leia-mensagem" for="modalLeiaInput"></label>
      <input id="modalLeiaInput" type="text" class="modal-leia-input"
             autocomplete="off" spellcheck="false" />
      <div class="modal-leia-botoes">
        <button id="modalLeiaOk" class="modal-leia-btn modal-leia-btn-ok">OK</button>
        <button id="modalLeiaCancelar" class="modal-leia-btn modal-leia-btn-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal de detecção de laço infinito -->
  <div id="modalLacoInfinito" class="modal-leia-overlay" role="alertdialog" aria-modal="true"
       aria-labelledby="modalLacoInfinitoTitulo" style="display:none;">
    <div class="modal-leia-caixa">
      <p id="modalLacoInfinitoTitulo" class="modal-leia-mensagem" style="font-weight:bold;">
        Possível laço infinito detectado
      </p>
      <p class="modal-leia-mensagem">
        A execução ultrapassou 1.000.000 de iterações. O programa pode estar em um laço infinito.
        Deseja continuar a execução ou abortar?
      </p>
      <div class="modal-leia-botoes">
        <button id="modalLacoInfinitoContinuar" class="modal-leia-btn modal-leia-btn-ok">Continuar</button>
        <button id="modalLacoInfinitoAbortar" class="modal-leia-btn modal-leia-btn-cancelar">Abortar</button>
      </div>
    </div>
  </div>
</body>

</html>
